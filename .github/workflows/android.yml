name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper and Build APK
      run: |
        # الانتقال إلى مجلد المشروع
        cd FacebookPhotoFixer
        
        # تثبيت أداة Gradle يدوياً لتعويض الملفات الناقصة في المستودع
        sudo apt-get update && sudo apt-get install -y gradle
        
        # إنشاء ملفات gradlew المفقودة تلقائياً بالكامل
        gradle wrapper --gradle-version 8.7
        
        # منح الصلاحيات وبدء التجميع الفوري للـ APK
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FacebookPhotoFixer-APK
        path: |
          FacebookPhotoFixer/app/build/outputs/apk/debug/*.apk
