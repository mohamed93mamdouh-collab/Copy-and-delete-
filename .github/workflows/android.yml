name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable and Build APK
      run: |
        # البحث عن ملف gradlew في أي مكان داخل المستودع واكتشاف المجلد الصحيح
        GRADLEW_FILE=$(find . -name "gradlew")
        if [ -z "$GRADLEW_FILE" ]; then
          echo "خطأ: لم يتم العثور على ملف gradlew، تأكد من رفع محتويات المجلد مفكوكة بشكل صحيح!"
          exit 1
        fi
        
        # الانتقال إلى المجلد الذي يحتوي على مشروع الأندرويد
        PROJECT_DIR=$(dirname "$GRADLEW_FILE")
        cd "$PROJECT_DIR"
        
        # منح صلاحيات التشغيل وتنفيذ بناء الـ APK
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FacebookPhotoFixer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
