name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: cd FacebookPhotoFixer && chmod +x gradlew
      
    - name: Build Debug APK
      run: cd FacebookPhotoFixer && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FacebookPhotoFixer-APK
        path: FacebookPhotoFixer/app/build/outputs/apk/debug/app-debug.apk
        
